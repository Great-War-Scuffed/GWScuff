 ARMY_EXPERIENCE_DESC: "전투에서 장비를 사용하면 육군 경험치를 얻을 수 있습니다. §H사단§!이 전투에서 교전하거나 동맹의 전쟁에  §H$lend_lease_string_caps$§!이 이루어질 경우 육군 경험치를 얻을 수 있습니다.\n적어도 $UNIT_TRAINING_LEVEL|Y$ 수준인 부대가 §H육군 훈련§!을 수료하거나 특정 §H국가중점§!은 추가적인 육군 경험치를 제공하며 일부 §H장관§!들 또한 육군 경험치의 획득을 늘릴 수 있습니다.\n\n육군 경험치는 §H사단 편제§!를 창설하고 재편할 때 필요합니다."
 AIR_EXPERIENCE_DESC: "적과의 교전 또는 §H조종사 훈련§!에 참여한 항공기는 공군 경험치를 얻을 수 있습니다. §H비행단§!이 전투에서 교전하거나 동맹 전쟁에 §H$lend_lease_string_caps$§!이 이루어질 경우 공군 경험치를 얻을 수 있습니다.\n특정 §H국가중점§!은 추가적인 공군 경험치를 제공하며 일부 §H장관§!들 또한 공군 경험치의 획득을 늘릴 수 있습니다.\n\n공군 경험치는 향상된 파생형 항공기 개발에 쓰입니다."
